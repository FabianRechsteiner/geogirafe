<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Stadtplan Winterthur: Karten, Themen und Objektinformationen." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      If redirect-url meta tag is present, a redirect will happen when the detected device is not iPhone or Android.
      The value of content should be a relative URL to the desired endpoint or page.
      To avoid redirection, simply remove this meta tag.
    -->
    <meta name="redirect-url" content="winterthur.html" />
    <meta name="configs" content="main,mobile" />
    <link rel="config-main-url" href="winterthur/config.json" />
    <link rel="config-mobile-url" href="winterthur/config.mobile.json" />

    <link rel="apple-touch-icon" sizes="192x192" href="images/logo/vectormap-icon-192.png" />
    <link rel="icon" type="image/x-icon" href="images/logo/vectormap-favicon.ico" />
    <link rel="manifest" href="winterthur.webmanifest" />

    <link rel="stylesheet" media="screen" href="src/styles/splash.css" />
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="winterthur/appearance.css" />
    <link rel="stylesheet" href="src/styles/common.mobile.css" />
    <link rel="stylesheet" href="src/styles/mobile.css" />

    <script type="module" src="src/main.mobile.ts"></script>
    <title>Stadtplan Winterthur</title>
  </head>

  <body>
    <div id="color-picker-container"></div>
    <div id="splash-screen">
      <img class="splash-logo" alt="Stadt Winterthur" src="winterthur/logo.png" />
      <div class="loader"></div>
      <span lang="de">Laden...</span>
    </div>
    <girafe-app>
      <div class="bottom-button-container-mobile">
        <girafe-align-north-button-mobile></girafe-align-north-button-mobile>

        <!-- <girafe-offline></girafe-offline> -->
        <girafe-geolocation-mobile></girafe-geolocation-mobile>
        <girafe-display-selector-button-mobile></girafe-display-selector-button-mobile>
        <girafe-display-menu-button-mobile></girafe-display-menu-button-mobile>
      </div>

      <girafe-search></girafe-search>
      <girafe-modals></girafe-modals>
      <div id="content">
        <girafe-map></girafe-map>
        <girafe-infobox></girafe-infobox>
      </div>
      <girafe-swipe-up-panel>
        <girafe-theme-select slot="main"></girafe-theme-select>
        <girafe-selection-panel-mobile slot="main"></girafe-selection-panel-mobile>
        <girafe-drawing-container-mobile slot="main"></girafe-drawing-container-mobile>

        <!-- Mobile menu and its content -->
        <girafe-menu-mobile slot="main">
          <girafe-menu-mobile-3d-button slot="mobile-menu-content"></girafe-menu-mobile-3d-button>
          <girafe-menu-mobile-offline-button slot="mobile-menu-content"></girafe-menu-mobile-offline-button>
          <girafe-menu-mobile-drawing-button slot="mobile-menu-content"></girafe-menu-mobile-drawing-button>
          <girafe-oauth-mobile slot="mobile-menu-content"></girafe-oauth-mobile>
        </girafe-menu-mobile>

        <girafe-offline slot="main"></girafe-offline>
      </girafe-swipe-up-panel>
    </girafe-app>
  </body>
</html>
