<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/lib/font-gis/css/font-gis.css" />
    <link rel="stylesheet" href="/lib/tippy.js/tippy.min.css" />
    <script type="text/javascript" src="/lib/cesium/Cesium.js"></script>
    <script type="module" src="./initialize.js"></script>
    <title>GeoGirafe</title>
  </head>
  <body>
    <header>
      <girafe-theme-select themes="/Mock/themes.json"></girafe-theme-select>
      <img id="logo" alt="geogirafe-logo" src="/static/images/logo_small.png" />
      <girafe-search id="search" search-url="https://pi.paloo.fr/mapbs/search?limit=90&partitionlimit=15&interface=desktop&query=###SEARCHTERM###"></girafe-search>
      <div id="buttonbar">
        <girafe-button icon-style="fa-2xl fa-solid fa-user"></girafe-button>
        <girafe-menu-button icon-style="fa-2xl fa-solid fa-ellipsis-vertical">
            <div slot="menu-content">
              <girafe-button icon-style="fa-xl fa-regular fa-pen-to-square" text="Draw" message="RedLining" action="redliningToggled"></girafe-button>
              <girafe-button icon-style="fa-xl fa-solid fa-print" text="Print" message="App" action="printToggled"></girafe-button>
              <girafe-proj-select></girafe-proj-select>
              <girafe-language-select default="de"></girafe-language-select>
              <girafe-button icon-style="fa-xl fa-solid fa-globe" text="3D" message="Map" action="globeToggled"></girafe-button>
              <girafe-button icon-style="fa-xl fa-brands fa-gitlab" text="Source" href="https://gitlab.com/geogirafe/gg_viewer"></girafe-button>
            </div>
          </girafe-menu-button>
      </div>
    </header>
    <girafe-tree-view themes="/Mock/themes.json" dock="left"></girafe-tree-view>
    <girafe-map srid="EPSG:2056" zoom="16" center="2611377,1267643" max-extent="2600972,1262492,2623553,1272772"></girafe-map>
    <girafe-redlining dock="right"></girafe-redlining>
    <girafe-print print-url="https://pi.paloo.fr/mapbs/printproxy/" default-layout="print_A4_hochformat" dock="right"></girafe-print>
    <girafe-selection-window></girafe-selection-window>
    <footer>
      <girafe-basemap-select themes="/Mock/themes.json"></girafe-basemap-select>
      
    </footer>
  </body>
</html>
