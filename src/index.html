<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/lib/font-gis/css/font-gis.css" />
    <link rel="stylesheet" href="/lib/tippy.js/tippy.min.css" />
    <script type="text/javascript" src="/lib/cesium/Cesium.js"></script>
    <script type="module" src="./initialize.js"></script>
    <title>GeoGirafe</title>
  </head>
  <body>
    <header>
      <girafe-theme-select themes="/Mock/themes.json"></girafe-theme-select>
      <img id="logo" src="/static/images/logo_small.png" />
      <girafe-search id="search" search-url="https://pi.paloo.fr/search?limit=90&partitionlimit=15&interface=desktop&query=###SEARCHTERM###"></girafe-search>
      <div id="buttonbar">
        <girafe-button icon-style="fa-2xl fa-solid fa-user"></girafe-button>
        <girafe-button icon-style="fa-2xl fa-solid fa-globe" message="Map" action="globeToggled"></girafe-button>
        <girafe-button icon-style="fa-2xl fa-solid fa-print" message="App" action="printToggled"></girafe-button>
        <girafe-button icon-style="fa-2xl fa-regular fa-pen-to-square" message="RedLining" action="redliningToggled"></girafe-button>
      </div>
    </header>
    <girafe-tree-view themes="/Mock/themes.json" dock="left"></girafe-tree-view>
    <girafe-map srid="EPSG:2056" zoom="16" center="2611377,1267643" max-extent="2600972,1262492,2623553,1272772"></girafe-map>
    <girafe-redlining dock="right"></girafe-redlining>
    <girafe-print print-url="https://pi.paloo.fr/printproxy/" default-layout="print_A4_hochformat" dock="right"></girafe-print>
    <girafe-selection-window></girafe-selection-window>
    <footer>
      <girafe-basemap-select themes="/Mock/themes.json"></girafe-basemap-select>
      <girafe-proj-select></girafe-proj-select>
      <girafe-language-select default="de"></girafe-language-select>
    </footer>
  </body>
</html>
