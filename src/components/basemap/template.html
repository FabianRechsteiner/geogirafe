<link rel="stylesheet" href="styles/common.css" />

<girafe-menu-button open="up">
  <button slot="menu-button" class="girafe-button-small">
    <img alt="menu-icon" src="icons/layer-group.svg" />
  </button>

  <div slot="menu-content" id="container">
    ${Object.values(this.state.basemaps).map(basemap => uHtml.for(basemap)`
    <button class="girafe-button-large" onclick="${() => this.changeBasemap(basemap)}">
      <img alt="basemap-icon" src="icons/basemap.svg" />
      <span i18n="${basemap.name}">${basemap.name}</span></button
    >` )}
  </div>
</girafe-menu-button>
