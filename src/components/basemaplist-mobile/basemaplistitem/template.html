<div id="basemap-container" class="cover-img" onpointerup="${() => this.activate()}">
  <div class="${this.isActive ? 'overlay overlay-active' : 'overlay overlay-inactive'}">
    <div class="${this.isActive ? 'title title-active' : 'title title-inactive'}" i18n="${this.basemap.name}"></div>
  </div>
</div>
