<girafe-menu-button id="menu-button" icon-style="fa-xl fa-solid fa-language" open="left">
  <div slot="menu-content">
    ${Object.values(this.languages).map(language => uHtml.for(language)`
      <girafe-button text="${language}" icon-style="fa-xl fa-solid fa-language" onclick="${() => this.changeLanguage(language)}"></girafe-button>
    `)}
  </div>
</girafe-menu-button>
