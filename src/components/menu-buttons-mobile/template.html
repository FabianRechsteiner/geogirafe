<!-- prettier-ignore -->

<div
  onpointerup="${() => this.onPointerUp()}"
  class="menu-item"
>
  <div class="menu-item-image-container">
    <img alt="switch-icon" src="${this.icon}" />
  </div>
  <div class="menu-item-title-container">
    <div class="menu-item-title" i18n="${this.label}"></div>
  </div>
</div>
