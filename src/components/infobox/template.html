<div class="content">
  ${(this.state.infobox.elements ?? []).map(info => uHtml`
  <div class="${info.type}">
    <span i18n="${this.linkify(info.text)}"></span>
    <button class="gg-icon-button gg-small" onclick="${() => this.closeMessage(info)}" tip="Close message">
      <img alt="close-icon" src="icons/close.svg" />
    </button>
  </div>
  `)}
</div>
