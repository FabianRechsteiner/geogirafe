<div class="map-info-contextmenu">
  <button class="contextmenu-closer gg-icon-button gg-small" onclick="${() => this.closeMenu()}"></button>
  <div>
    <table class="custom-table">
      <colgroup>
        <col style="width: 150px" />
        <col style="width: 120px" />
        <col style="width: 30px" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col"></th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        ${ this.MapContextMenuState.crs.map(f => uHtml`
        <tr>
          <td i18n="${f.translation}"></td>
          <td>
            ${ this.printCoordinate(this.proj4(this.projection, f.code, this.position), f.format,
            f.precision).map((x:string) => uHtml`
            <div>${x}</div>
            `)}
          </td>
          <td>
            <div class="justify-right">
              <button
                class="gg-icon-button gg-small"
                tip="Copy value"
                tip-placement="top"
                onclick="${() => {navigator.clipboard.writeText(this.printCoordinate(this.proj4(this.projection, f.code, this.position), f.format,
            f.precision).join(', '))}}">
                <img src="icons/content_copy.svg" alt="${this.i18nManager.getTranslation('Copy value')}" />
              </button>
            </div>
          </td>
        </tr>
        `) } ${ this.MapContextMenuState.sources.map(f => uHtml`
        <tr>
          <td i18n="${f.translation}"></td>
          <td>
            <span class="custom-cell"
              >${f.content ? f.content : uHtml`<img
                src="icons/progress.svg"
                class="gg-spin gg-small"
                alt="${this.i18nManager.getTranslation('Loading')}" />`}
            </span>
          </td>
          <td>
            <div class="justify-right">
              <button
                class="gg-icon-button gg-small"
                tip="Copy value"
                tip-placement="top"
                onclick="${() => {navigator.clipboard.writeText(f.content ? f.content : '')}}">
                <img src="icons/content_copy.svg" alt="${this.i18nManager.getTranslation('Copy value')}" />
              </button>
            </div>
          </td>
        </tr>
        `) }
      </tbody>
    </table>
  </div>
  <svg class="tooltip-triangle" viewBox="0 0 20 10" preserveAspectRatio="none">
    <polygon points="0,0 10,10 20,0" class="triangle-fill" />
    <path d="M0,0 L10,10 L20,0" class="triangle-border" />
  </svg>
</div>
