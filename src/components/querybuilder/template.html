<div class="container">
  <div class="${this.loading ? 'loading' : 'loading hidden'}">
    <img alt="loading-icon" src="icons/loading.svg" class="gg-spin" />
    Loading server configuration...
  </div>
  <div class="${this.deactivated ? 'deactivated' : 'deactivated hidden'}">
    <img alt="info-icon" src="icons/info.svg" />
    Filtering deactivated: layers in layergroup don't have identical attributes.
  </div>
  <div class="${this.loading || this.deactivated ? 'content hidden' : 'content'}">
    <div class="custom-select">
      <select id="attribute" name="attribute" onchange="${() => this.attributeChanged()}">
        <option value="" disabled ?selected="${!this.currentLayerAttribute}">Select attribute...</option>
        ${this.layerAttributes.map(attr => uHtmlFor(attr, attr.name)`
        <option i18n="${attr.name}" value="${attr.name}" ?selected="${this.currentLayerAttribute?.name==attr.name}">
          ${attr.name}
        </option>
        `)}
      </select>
    </div>

    <div class="custom-select">
      <select id="operator" name="operator" onchange="${() => this.operatorChanged()}">
        <option value="" disabled selected>Select operator...</option>
        ${this.operatorOptions.map(option => uHtmlFor(option, option.operator)`
          <option value="${option.operator}">${option.displayName}</option>
        `)}
      </select>
    </div>

    <input
      id="val"
      type="${this.inputTypeForFilterValue}"
      class="${this.showVal ? '' : 'hidden'}"
      placeholder="${this.showVal2 ? 'Enter lower boundary...' : 'Enter value...'}"
      onkeydown="${(e:KeyboardEvent)=>this.onValueKeyPress(e)}" />

    <input
      id="val2"
      type="${this.inputTypeForFilterValue}"
      class="${this.showVal2 ? '' : 'hidden'}"
      placeholder="Enter upper boundary..."
      onkeydown="${(e:KeyboardEvent)=>this.onValueKeyPress(e)}" />

    <button class="gg-button gg-medium" tip="Apply filter" onclick="${() => this.filter()}">
      <img alt="filter-icon" src="icons/filter.svg" />
    </button>

    <button class="gg-button gg-medium" tip="Remove filter" onclick="${() => this.removeFilter()}">
      <img alt="delete-icon" src="icons/trash.svg" />
    </button>
  </div>
</div>
