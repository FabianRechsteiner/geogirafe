<link rel="stylesheet" href="lib/font-gis/font-gis.css" />
<link rel="stylesheet" href="lib/vanilla-picker/vanilla-picker.csp.css" />
<div id="panel">
  <div id="toolbar">
    <button id="disable" tip="Disable drawing" class="selected"><i class="fg-arrow-o fg-lg"></i></button>
    <button id="point" tip="Point"><i class="fg-point fg-lg"></i></button>
    <button id="line" tip="Line"><i class="fg-polyline-pt fg-lg"></i></button>
    <button id="polygon" tip="Polygon"><i class="fg-polygon-pt fg-lg"></i></button>
    <button id="square" tip="Square"><i class="fg-square-pt fg-lg"></i></button>
    <button id="rectangle" tip="Rectangle"><i class="fg-rectangle-pt fg-lg"></i></button>
    <button id="circle" tip="Circle"><i class="fg-circle-o fg-lg"></i></button>
    <button id="freeline" tip="Freehand line"><i class="fg-polyline fg-lg"></i></button>
    <button id="freepolygon" tip="Freehand polygon"><i class="fg-polygon-o fg-lg"></i></button>
    <div id="toolParameters">
      <input type="checkbox" id="fixedLengthEnabled" />
      <label class="fixedLengthElement disabled" for="fixedLengthValue">Fix length to </label>
      <input class="fixedLengthElement disabled" type="number" id="fixedLengthValue" />
      <label class="fixedLengthElement disabled" for="fixedLengthValue">meters</label>
    </div>
  </div>
  <div id="drawingListContainer">
    <div id="drawingList">

      ${this.drawingState.features.map(feature => uHtmlFor(feature, feature.id)`

      <div id="${'f-' + feature.id}" class="girafe">

        <button id="${'f-select-' + feature.id}"
                class="gg-button icon" tip="Select to change appearance"
                onclick="${() => this.onToggleFeatureSelection(feature)}">
          ${this.htmlUnsafe(feature.selected ? this.checkedIcon : this.noCheckedIcon)}
        </button>

        <button class="gg-button icon" tip="Center on shape"
                onclick="${() => this.olDrawing.centerViewOnFeature(feature)}">
          ${this.htmlUnsafe(this.locateIcon)}
        </button>

        <span id="${'f-name-' + feature.id}">${feature.name}</span>

        <button class="gg-button icon" tip="Delete shape"
                onclick="${() => this.deleteFeature(feature)}">
          ${this.htmlUnsafe(this.trashIcon)}
        </button>

      </div>
      `)}
      
    </div>
  </div>
  <div id="options" class="${this.selectedFeatures.length > 0 ? '' : 'disabled'}">
    <input id="optionsTitle" type="text" value="${this.getOptionsTitle()}"
           class="${this.selectedFeatures.length > 1 ? 'disabled' : ''}" />
    <div id="optionsText">
      <div id="optionsTextLines">
        <span>Name</span>
        <button class="gg-button icon" id="visibleIconName"
                tip="Show or hide shape name"
                onclick="${()=>this.toggleNameVisibility()}">
          ${this.htmlUnsafe(this.isDisplayNameEnabled() ? this.visibleIcon: this.notVisibleIcon)}
        </button>
        <span>Font</span>
        <input
          id="optionsNameFontSize"
          type="number"
          min="1"
          value="${this.selectedFeatures[0]?.nameFontSize}"
          oninput="${()=>this.onOptionsChange()}" />
        <span>pt</span>
        <div class="icon colorPicker" id="nameColorPicker"></div>
        <span>Measures</span>
        <button class="gg-button icon" id="visibleIconMeasure"
                tip="Show or hide measure information"
                onclick="${()=>this.toggleMeasureVisibility()}">
          ${this.htmlUnsafe(this.isDisplayMeasureEnabled() ? this.visibleIcon: this.notVisibleIcon)}
        </button>
        <span>Font</span>
        <input
          id="optionsMeasuresFontSize"
          type="number"
          min="1"
          value="${this.selectedFeatures[0]?.measureFontSize}"
          oninput="${()=>this.onOptionsChange()}" />
        <span>pt</span>
        <div class="icon colorPicker" id="measureColorPicker"></div>
      </div>
    </div>
    <hr />
    <div id="optionsColor">
      <div id="optionsColorLine">
        <span>Stroke color</span>
        <div class="icon colorPicker" id="strokePicker"></div>
        <span id="fillPickerSpan" class="${this.isFillColorEnabled() ? '' : 'disabled'}">Fill color</span>
        <div class="${'icon colorPicker ' + (this.isFillColorEnabled() ? '' : 'disabled')}" id="fillPicker"></div>
      </div>
    </div>
    <hr />
    <div id="optionsLine">
      <div id="optionsLineLines">
        <span>Line width</span>
        <input
          id="optionsStrokeWidth"
          type="number"
          min="1"
          value="${this.selectedFeatures[0]?.strokeWidth}"
          oninput="${()=>this.onOptionsChange()}" />
        <span>px</span>
      </div>
    </div>
    <hr />
    <div id="optionsExport">
      <div id="optionsExportLine">
        <span>Export</span>
        <button onclick='${() =>this.exportSelectedFeatures("geojson")}'>GeoJson</button>
        <button onclick='${() =>this.exportSelectedFeatures("kml")}'>KML</button>
        <button onclick='${() =>this.exportSelectedFeatures("gpx")}'>GPX</button>
      </div>
    </div>
  </div>
</div>
