<div class="${this.state.oauth.status === 'loggedIn' ? 'hidden' : 'container'}">
  <span>Login</span>
  <button class="gg-button gg-medium" onclick="${() => this.onLoginClick()}">
    <img alt="menu-icon" src="icons/user.svg" />
  </button>
</div>
<div class="${this.state.oauth.status !== 'loggedIn' ? 'hidden' : 'container'}">
  <span>${this.state.oauth.geomapfish.userInfo?.username}</span>
  <button class="gg-button gg-medium" onclick="${() => this.onLogoutClick()}">
    <img alt="menu-icon" src="icons/user.svg" />
  </button>
</div>
