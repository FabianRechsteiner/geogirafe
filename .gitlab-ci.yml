stages:
  - test
  - build
  - docker-build
  - pages
  - scan

unitests:
  stage: test
  image: node:18-slim
  
  script: 
    # build
    - npm i
    - npm run-script test

npm-audit:
  stage: test
  image: node:18-slim
  
  script: 
    # build
    - npm i
    - npm audit
    - npm audit signatures

# Static Application Security Testing
include:
- template: Security/SAST.gitlab-ci.yml

# Build the application
build:
  stage: build
  image: node:18-slim

  before_script:
    - apt update && apt -y upgrade
  script: 
    - npm i
    - npm run-script build

  artifacts:
    paths:
      - public

docker-build:
  stage: docker-build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - docker info
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN

  script: 
    # build
    - docker build -t geogirafe/viewer -f buildtools/Dockerfile .
    # push
    - docker push geogirafe/viewer


# Publish Demo-Application to GitLab-Pages
pages:
  stage: pages
  image: debian:stable-slim
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - apt update && apt -y upgrade && apt install -y brotli curl
  script: 
    # Create a instance for a sample cartoriviera instance
    - cp -R public cartoriviera && mv cartoriviera public/
    - rm public/cartoriviera/config.json 
    - cp public/config.cartoriviera.json public/cartoriviera/config.json
    # Create a instance for a sample cartolacote instance
    - cp -R public cartolacote && mv cartolacote public/
    - rm public/cartolacote/config.json 
    - cp public/config.cartolacote.json public/cartolacote/config.json

    # Wget themes.json to improve performance on demo instance
    - curl "https://map.geo.bs.ch/themes?background=background&interface=desktop" --output public/Mock/themes.json
    - curl "https://map.cartoriviera.ch/themes?background=background&interface=desktop" --output public/cartoriviera/Mock/themes.json
    - curl "https://map.cartolacote.ch/themes?background=background&interface=desktop" --output public/cartolacote/Mock/themes.json

    # Compress all files
    - find public -type f -regex '.*\.\(html\|css\|json\)' -exec brotli -k -f {} \;
    - find public -type f -regex '.*\.\(html\|css\|json\)' -exec gzip -k -f {} \;

  artifacts:
    paths:
      # Directory needs to be named 'public' for GitLab Pages
      - public

zap-baseline-scan:
  stage: scan
  image: owasp/zap2docker-stable
  dependencies:
    - pages
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  script:
    - mkdir /zap/wrk
    # TODO REG: By default, all alerts are reported as warnings.
    # TODO REG: Configure wich ones should be peported as "fail"
    - /zap/zap-baseline.py -j -I -t https://geogirafe.paloo.fr -r report.html -w report.md -x report.xml -J report.json
  artifacts:
    paths:
      # Directory needs to be named 'public' for GitLab Pages
      - /zap/wrk
