stages:
  - test
  - build
  - docker-build
  - pages
  - scan

#################################
# Define pipeline variables
variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

#################################
# run unittests
#unitests:
#  stage: test
#  image: node:18-slim
#  
#  script: 
#    # build
#    - npm i
#    - npm run test

#################################
# Audit NPM dependencies to find any known vulnerability 
npm-audit:
  stage: test
  image: node:18-slim
  
  script: 
    # build
    - npm i
    - npm audit
    - npm audit signatures

#################################
# Quality, readability, reliability and security checks with Sonarcloud 
sonarcloud-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main
    - sonarcloud

#################################
# Static Application Security Testing with GitLab
include:
- template: Security/SAST.gitlab-ci.yml

#################################
# Build the application for production
build:
  stage: build
  image: node:18-slim

  before_script:
    - apt update && apt -y install jq brotli
  script: 
    - npm i --omit=dev
    - npm run build
    # List all dependencies
    - npm list --all --omit=dev
    # Generate Version Number
    - version=$(jq -r '.version' package.json)
    - echo '{"version":"'$version'", "build":"'$CI_PIPELINE_ID'", "date":"'$(date +'%d/%m/%Y')'"}' > public/about.json
    # Compress all files
    - find public -type f -regex '.*\.\(html\|css\|js\|json\)' -exec brotli -k -f {} \;
    - find public -type f -regex '.*\.\(html\|css\|js\|json\)' -exec gzip -k -f {} \;
  artifacts:
    paths:
      - public

#################################
# Create a docker image with the production build
docker-build:
  stage: docker-build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - docker info
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN

  script: 
    # build
    - docker build -t geogirafe/viewer -f buildtools/Dockerfile .
    # push
    - docker push geogirafe/viewer

#################################
# Some tool functions to simplify demo configuration and publication
.prepare_demo: &prepare_demo |
  cp -R public $demo && mv $demo release/
  cp demo/config.$demo.json release/$demo/config.json
  gzip -k -f release/$demo/config.json
  brotli -k -f release/$demo/config.json

#################################
# Publish demo applications to GitLab-Pages
pages:
  stage: pages
  image: debian:stable-slim
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - apt update && apt install -y brotli curl
    - mkdir -p public/Mock
    - mkdir release
  script: 
    # Prepare all demo environments
    - demo='mapbs'
    - *prepare_demo
    - demo='cartoriviera'
    - *prepare_demo
    - demo='cartolacote'
    - *prepare_demo
    - demo='mapnv'
    - *prepare_demo
    - demo='sitn'
    - *prepare_demo
    - demo='schwyz'
    - *prepare_demo
    - demo='lie'
    - *prepare_demo
    # Rename the release directory to public
    - rm -Rf public && mv release public
    # Copy demo index page
    - cp demo/index.html public/
    - cp -R demo/static public/

    # Wget themes.json to improve performance on demo instance
    # (this does not work for cartoriviera.ch, it seems to be blocked)
    # MapBS
    - curl "https://map.geo.bs.ch/themes?background=background&interface=desktop" --output public/mapbs/Mock/themes.json
    - gzip -k -f public/mapbs/Mock/themes.json
    - brotli -k -f public/mapbs/Mock/themes.json
    # Cartolacote
    - curl "https://map.cartolacote.ch/themes?background=background&interface=desktop" --output public/cartolacote/Mock/themes.json
    - gzip -k -f public/cartolacote/Mock/themes.json
    - brotli -k -f public/cartolacote/Mock/themes.json
    # MapNV
    - curl "https://mapnv.ch/themes?background=background&interface=desktop" --output public/mapnv/Mock/themes.json
    - gzip -k -f public/mapnv/Mock/themes.json
    - brotli -k -f public/mapnv/Mock/themes.json
    # SITN
    - curl "https://sitn.ne.ch/themes?background=desktop_background&interface=desktop" --output public/sitn/Mock/themes.json
    - curl "https://sitn.ne.ch/printproxy/capabilities.json" --output public/sitn/Mock/capabilities.json
    - gzip -k -f public/sitn/Mock/themes.json public/sitn/Mock/capabilities.json
    - brotli -k -f public/sitn/Mock/themes.json public/sitn/Mock/capabilities.json
    # Schwyz
    - curl "https://map.geo.sz.ch/themes?background=background&interface=desktop" --output public/schwyz/Mock/themes.json
    - gzip -k -f public/schwyz/Mock/themes.json
    - brotli -k -f public/schwyz/Mock/themes.json
    # Liechtenstein
    - curl "https://map.geo.llv.li/themes?background=background&interface=desktop" --output public/lie/Mock/themes.json
    - curl "https://map.geo.llv.li/static/X/de.json" --output public/lie/Mock/de.json
    - curl "https://map.geo.llv.li/printproxy/capabilities.json" --output public/lie/Mock/capabilities.json
    - gzip -k -f public/lie/Mock/themes.json public/lie/Mock/de.json public/lie/Mock/capabilities.json
    - brotli -k -f public/lie/Mock/themes.json public/lie/Mock/de.json public/lie/Mock/capabilities.json

  artifacts:
    paths:
      # Directory needs to be named 'public' for GitLab Pages
      - public

#################################
# Perform a baseline security scan of the application using ZAP-Proxy
zap-baseline-scan:
  stage: scan
  image: owasp/zap2docker-stable
  dependencies:
    - pages
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  script:
    - mkdir /zap/wrk
    # TODO REG: By default, all alerts are reported as warnings.
    # TODO REG: Configure which ones should be reported as "fail"
    - /zap/zap-baseline.py -j -I -t https://geogirafe.paloo.fr/mapbs/ -r report.html -w report.md -x report.xml -J report.json
  artifacts:
    paths:
      - /zap/wrk
