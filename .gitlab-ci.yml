stages:
- unit
- sast
- pages

# Execute Unit-Tests
Unit Testing:
  stage: unit
  image: node:18-slim
  script: 
    # build
    - npm i
    - npm run-script test

# Static Application Security Testing
SAST:
  stage: sast
include:
- template: Security/SAST.gitlab-ci.yml

# Publish Demo-Application to GitLab-Pages
pages:
  stage: pages
  image: node:18-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - apt update && apt -y upgrade && apt install -y brotli
  script: 
    # build
    - npm i
    - npm run-script build
    # Compress files
    - find public -type f -regex '.*\.\(html\|css\|json\)' -exec brotli -k -f {} \;
    - find public -type f -regex '.*\.\(html\|css\|json\)' -exec gzip -k -f {} \;

  artifacts:
    paths:
      # Directory needs to be named 'public' for GitLab Pages
      - public
