<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeoGirafe is an flexible application to build online geoportals." />

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="stylesheet" media="screen" href="src/index.css" />
    <link rel="stylesheet" media="screen" href="src/index.mobile.css" />

    <link
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
      href="lib/fontawesome/css/all.min.css" />
    <noscript>
      <link rel="stylesheet" href="lib/fontawesome/css/all.min.css" />
    </noscript>
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="lib/font-gis/font-gis.css" />
    <noscript>
      <link rel="stylesheet" href="lib/font-gis/font-gis.css" />
    </noscript>
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="lib/tippy.js/tippy.css" />
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="lib/tippy.js/backdrop.css" />
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="lib/tippy.js/border.css" />
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="lib/tippy.js/svg-arrow.css" />
    <noscript>
      <link rel="stylesheet" href="lib/tippy.js/tippy.css" />
      <link rel="stylesheet" href="lib/tippy.js/backdrop.css" />
      <link rel="stylesheet" href="lib/tippy.js/border.css" />
      <link rel="stylesheet" href="lib/tippy.js/svg-arrow.css" />
    </noscript>

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="lib/fontawesome/webfonts/fa-solid-900.woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="lib/fontawesome/webfonts/fa-regular-400.woff2"
      crossorigin="anonymous" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="lib/font-gis/font-gis.woff2?t=1634903189298"
      crossorigin="anonymous" />

    <script type="module" src="src/main.ts"></script>
    <title>GeoGirafe</title>
  </head>

  <body>
    <header>
      <girafe-theme-select></girafe-theme-select>
      <img class="logo logo-light" alt="geogirafe-logo" src="images/logo_small.webp" />
      <img class="logo logo-dark" alt="geogirafe-logo" src="images/logo_black_small.webp" />
      <girafe-search id="search"></girafe-search>
      <div id="buttonbar">
        <girafe-video-record></girafe-video-record>
        <girafe-nav-history></girafe-nav-history>
        <girafe-button
          icon-style="fa-2xl fa-solid fa-user"
          onclick="throw new Error('Login not implemented')"></girafe-button>
        <girafe-colorswitcher></girafe-colorswitcher>
        <girafe-button
          icon-style="fa-2xl fa-solid fa-circle-question"
          onclick="document.geogirafe.state.interface.helpVisible = true">
        </girafe-button>
        <girafe-button
          icon-style="fa-2xl fa-solid fa-share-nodes"
          onclick="document.geogirafe.state.interface.shareVisible = true">
        </girafe-button>
        <girafe-menu-button icon-style="fa-2xl fa-solid fa-ellipsis-vertical">
          <div slot="menu-content">
            <girafe-button
              icon-style="fa-xl fa-regular fa-pen-to-square"
              text="Draw"
              onclick="document.geogirafe.state.interface.redliningPanelVisible = !document.geogirafe.state.interface.redliningPanelVisible">
            </girafe-button>
            <girafe-button
              icon-style="fa-xl fa-solid fa-print"
              text="Print"
              onclick="document.geogirafe.state.interface.printPanelVisible = !document.geogirafe.state.interface.printPanelVisible">
            </girafe-button>
            <girafe-proj-select></girafe-proj-select>
            <girafe-language-select></girafe-language-select>
            <girafe-globe-select></girafe-globe-select>
            <girafe-button
              icon-style="fa-xl fa-solid fa-circle-info"
              class="border-top"
              text="about"
              onclick="document.geogirafe.state.interface.aboutVisible = true">
            </girafe-button>
          </div>
        </girafe-menu-button>
      </div>
    </header>

    <div id="content">
      <div id="main">
        <girafe-lr-panel class="panel-left" dock="left">
          <girafe-tree-view slot="main"></girafe-tree-view>
        </girafe-lr-panel>
        <div id="content-map">
          <girafe-map></girafe-map>
          <div class="info-area">
            <girafe-infobox></girafe-infobox>
            <footer>
              <girafe-scale></girafe-scale>
              <girafe-coordinate></girafe-coordinate>
            </footer>
          </div>
        </div>
        <girafe-lr-panel class="panel-right" dock="right">
          <div slot="main">
            <girafe-redlining data-toggle-path="interface.printPanelVisible"></girafe-redlining>
            <girafe-print data-toggle-path="interface.redliningPanelVisible"></girafe-print>
          </div>
        </girafe-lr-panel>
        <girafe-about></girafe-about>
        <girafe-share></girafe-share>
        <!-- <girafe-selection-window></girafe-selection-window> -->
        <girafe-help></girafe-help>
        <girafe-prototype-banner></girafe-prototype-banner>
      </div>
      <div id="content-bottom">
        <girafe-selection-grid dock="bottom"></girafe-selection-grid>
      </div>
    </div>
  </body>
</html>
