name: Validate Application

on:
  push:
    branches:
      - agent
  pull_request:
    branches:
      - agent
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime config
        run: npm run check:runtime-config

      - name: Validate Winterthur catalog
        # The Winterthur import is checked offline; CI never silently updates the catalog.
        run: npm run winterthur:check && npm run winterthur:test

      - name: TypeScript compilation
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test-without-coverage

      - name: Build
        run: npm run build

      - name: Validate build artifact
        run: npm run check:artifact
