<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stadtplan Winterthur: Karten, Themen und Objektinformationen." />

    <!--
      If redirect-url meta tag is present, a redirect will happen when the detected device is an iPhone or Android.
      The value of content should be a relative URL to the desired endpoint or page.
    -->
    <meta name="redirect-url" content="winterthur.mobile.html" />
    <meta name="configs" content="main" />
    <link rel="config-main-url" href="winterthur/config.json" />

    <link rel="apple-touch-icon" sizes="192x192" href="images/logo/vectormap-icon-192.png" />
    <link rel="icon" type="image/x-icon" href="images/logo/vectormap-favicon.ico" />
    <link rel="manifest" href="winterthur.webmanifest" />

    <link rel="stylesheet" media="screen" href="src/styles/splash.css" />
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="winterthur/appearance.css" />
    <link rel="stylesheet" href="src/styles/common.css" />
    <link rel="stylesheet" href="src/styles/index.css" />

    <link
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      href="lib/tippy.js/tippy.css" />
    <link
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      href="lib/tippy.js/backdrop.css" />
    <link
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      href="lib/tippy.js/border.css" />
    <link
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
      href="lib/tippy.js/svg-arrow.css" />
    <noscript>
      <link rel="stylesheet" href="lib/tippy.js/tippy.css" />
      <link rel="stylesheet" href="lib/tippy.js/backdrop.css" />
      <link rel="stylesheet" href="lib/tippy.js/border.css" />
      <link rel="stylesheet" href="lib/tippy.js/svg-arrow.css" />
    </noscript>

    <script type="module" src="src/main.ts"></script>
    <title>Stadtplan Winterthur</title>
  </head>

  <body>
    <div id="splash-screen">
      <img class="splash-logo" alt="Stadt Winterthur" src="winterthur/logo.png" />
      <div class="loader"></div>
      <span lang="de">Laden...</span>
    </div>
    <girafe-app>
      <header>
        <girafe-theme-select data-tour="theme-selection"></girafe-theme-select>
        <img class="logo" alt="Stadt Winterthur" src="winterthur/logo.png" />
        <girafe-search id="search">
          <!-- <div slot="search-tooltip">
            <p>
              Create a custom tooltip
            </p>
          </div> -->
        </girafe-search>
        <girafe-news-button plugin="config:news"></girafe-news-button>
        <girafe-oauth></girafe-oauth>
        <girafe-nav-history></girafe-nav-history>
        <girafe-video-record></girafe-video-record>
      </header>

      <girafe-help></girafe-help>
      <girafe-modals></girafe-modals>
      <girafe-default-context-menu></girafe-default-context-menu>
      <girafe-custom-context-menu></girafe-custom-context-menu>

      <div id="content">
        <div id="main">
          <girafe-lr-panel class="panel-left" dock="left">
            <girafe-tree-view slot="main"></girafe-tree-view>
          </girafe-lr-panel>
          <div id="content-map">
            <girafe-map></girafe-map>
            <div class="info-area">
              <girafe-basemap data-tour="basemap-selection"></girafe-basemap>
              <girafe-infobox></girafe-infobox>
            </div>
            <footer>
              <girafe-scale></girafe-scale>
              <girafe-coordinate projection="EPSG:2056"></girafe-coordinate>
              <span class="copyright">
                <span i18n="Information without public faith">Information without public faith</span>
                <span>
                  ©
                  <a href="https://stadt.winterthur.ch/" target="_blank" rel="noopener">Stadt Winterthur</a>,
                  <a href="https://doc.geomapfish.dev" target="_blank">GeoGirafe</a>,
                  <a href="https://www.swisstopo.admin.ch/en/legal-basis" target="_blank">swisstopo</a>,
                  <a href="http://www.openstreetmap.org/copyright" target="_blank">OSM</a>
                </span>
              </span>
            </footer>
          </div>
          <girafe-lr-panel class="panel-right" dock="right">
            <girafe-drawing slot="main"></girafe-drawing>
            <girafe-selection-tool slot="main"></girafe-selection-tool>
            <girafe-print slot="main"></girafe-print>
            <girafe-ext-layer slot="main"></girafe-ext-layer>
            <girafe-cross-section-settings slot="main"></girafe-cross-section-settings>
            <girafe-news slot="main"></girafe-news>
            <girafe-edit slot="main"></girafe-edit>
            <girafe-layout slot="main"></girafe-layout>
            <girafe-about slot="main"></girafe-about>
            <girafe-user-preferences slot="main"></girafe-user-preferences>
            <girafe-share slot="main"></girafe-share>
            <girafe-contact slot="main"></girafe-contact>
          </girafe-lr-panel>

          <girafe-info-window></girafe-info-window>
          <girafe-selection-window></girafe-selection-window>
        </div>
        <div id="content-bottom">
          <girafe-selection-grid dock="bottom"></girafe-selection-grid>
          <girafe-cross-section-view id="cross-section-footer" dock="bottom"></girafe-cross-section-view>
        </div>
      </div>

      <div id="buttonbar">
        <button
          tip="drawing-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.drawingPanelVisible =
              !document.geogirafe.state.interface.drawingPanelVisible
          ">
          <img alt="draw-icon" src="icons/draw.svg" />
        </button>
        <button
          tip="selection-tool-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.selectionToolPanelVisible =
              !document.geogirafe.state.interface.selectionToolPanelVisible
          ">
          <img alt="draw-icon" src="icons/select.svg" />
        </button>
        <button
          tip="external-entry"
          slot="menu-content"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.extLayerPanelVisible =
              !document.geogirafe.state.interface.extLayerPanelVisible
          ">
          <img alt="ext-icon" src="icons/external-entry.svg" />
        </button>
        <button
          tip="print-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          plugin="config:print"
          onclick="
            document.geogirafe.state.interface.printPanelVisible = !document.geogirafe.state.interface.printPanelVisible
          ">
          <img alt="print-icon" src="icons/print.svg" />
        </button>
        <button
          tip="lidar-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          plugin="config:lidar"
          onclick="
            document.geogirafe.state.interface.crossSectionPanelVisible =
              !document.geogirafe.state.interface.crossSectionPanelVisible
          ">
          <img alt="cross-section-icon" src="icons/cross-section.svg" />
        </button>
        <button
          tip="edit-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.editPanelVisible = !document.geogirafe.state.interface.editPanelVisible
          ">
          <img alt="edit-icon" src="icons/edit.svg" />
        </button>
        <button
          tip="share-panel"
          slot="menu-content"
          class="gg-icon-button gg-big"
          plugin="config:share"
          onclick="
            document.geogirafe.state.interface.sharePanelVisible = !document.geogirafe.state.interface.sharePanelVisible
          ">
          <img alt="share-icon" src="icons/share.svg" />
        </button>
        <button
          tip="layout-panel"
          class="gg-icon-button gg-big"
          plugin="config:map3d"
          onclick="
            document.geogirafe.state.interface.layoutPanelVisible =
              !document.geogirafe.state.interface.layoutPanelVisible
          ">
          <img alt="layout-icon" src="icons/layout.svg" />
        </button>
        <button
          tip="contact-panel"
          class="gg-icon-button gg-big"
          plugin="config:contact"
          onclick="
            document.geogirafe.state.interface.contactPanelVisible =
              !document.geogirafe.state.interface.contactPanelVisible
          ">
          <img alt="layout-icon" src="icons/mail.svg" />
        </button>
        <button tip="infra3d" class="gg-icon-button gg-big" plugin="plugin_infra3d" onclick="alert('infra3d')">
          <img alt="help-icon" src="icons/infra3d.svg" />
        </button>

        <div class="filler"></div>

        <button
          tip="help"
          class="gg-icon-button gg-big"
          onclick="document.geogirafe.state.interface.helpVisible = true">
          <img alt="help-icon" src="icons/help.svg" />
        </button>
        <button
          tip="about-panel"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.aboutPanelVisible = !document.geogirafe.state.interface.aboutPanelVisible
          ">
          <img alt="info-icon" src="icons/info.svg" />
        </button>
        <button
          tip="user-preferences-panel"
          class="gg-icon-button gg-big"
          onclick="
            document.geogirafe.state.interface.userPreferencesPanelVisible =
              !document.geogirafe.state.interface.userPreferencesPanelVisible
          ">
          <img alt="user-preferences-icon" src="icons/config.svg" />
        </button>
      </div>
    </girafe-app>
  </body>
</html>
